server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker'in yerlesik DNS'i. Adresler degiskenle verildigi icin nginx
    # bunlari ACILISTA degil ISTEK ANINDA cozer - odyssey-auth ayakta
    # olmadiginda da nginx basarir, sadece o yol 502 verir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Oturum uclari -> odyssey-auth. BU BLOK /api/ BLOGUNDAN ONCE OLMALI
    # degil; nginx en uzun oneki secer, sirasi onemsiz. Ama olmasi SART:
    # bu blok yokken /api/auth/me bizim backend'e dusuyordu, orada oyle bir
    # uc olmadigi icin 401 donuyor ve uygulama "oturumunuz bulunamadi"
    # diyordu - dogrudan erisimde giris HIC calismiyordu.
    location /api/auth/ {
        set $auth_ust "${AUTH_INTERNAL_URL}";
        proxy_pass http://$auth_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Uygulamaya DOGRUDAN (Odyssey kabugu olmadan) girildiginde de API
    # cagrilarinin ayni origin uzerinden gitmesi icin proxy. Odyssey icinden
    # gelindiginde bu blok kullanilmaz - kabugun kendi nginx'i /api/mailer/
    # istegini zaten mailer-backend:8082'ye yonlendirir.
    # BACKEND_INTERNAL_URL container baslarken envsubst ile enjekte edilir.
    location /api/ {
        # Adres DEGISKENLE veriliyor: boylece nginx onu ACILISTA degil ISTEK
        # ANINDA cozer. Dogrudan "proxy_pass ${BACKEND_INTERNAL_URL}/api/"
        # yazilsaydi nginx adresi bir kez cozup onbellege alirdi; backend
        # konteyneri yeniden yaratilip IP degistiginde proxy eski adrese
        # vurmaya devam eder ve frontend yeniden baslatilana kadar 502 doner.
        # (Yasandi: backend rebuild sonrasi "connect() failed (111)".)
        set $backend_ust "${BACKEND_INTERNAL_URL}";
        proxy_pass $backend_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api /api;
    }

    # Odyssey kabugu bu uygulamayi /mailer/ onekiyle proxy'ler ve oneki
    # kaldirarak iletir; ama index.html icindeki varlik adresleri
    # (Vite base="/mailer/") her zaman onekli gelir. Dogrudan erisimde de
    # calissin diye ayni dosyalari bu onek altindan da veriyoruz.
    location /mailer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Vite hash'li dosya adlari uretir - /assets/ agresif cache'lenebilir.
    # index.html ise ASLA cache'lenmemeli, yoksa yeni deploy sonrasi
    # kullanicilar eski JS/CSS'i cagirmaya devam eder.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
