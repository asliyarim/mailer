# Odyssey kabugu ve kimlik servisi - YEREL calistirma icin.
#
# Bu iki proje ayri klasorlerde duruyor (C:\Users\40538\Downloads). Ana
# docker-compose.yml ile BIRLIKTE kullanilir, boylece hepsi ayni agda olur:
#
#   docker compose -f docker-compose.yml -f docker-compose.odyssey.yml up -d
#
# Giris adresi: http://localhost:4173 -> "Aksa Mailer" karti.
#
# Capacity Planner'a ihtiyac YOK. Kullanicilar odyssey-auth'un UserSeeder'i
# tarafindan ilk acilista yaziliyor (tablo bosken calisir), veritabani da
# local/init-db ile yaratiliyor - elle veri tasima adimi yok.
#
# DIKKAT - portlar: 4173 ve 8081, Capacity Planner'in Odyssey yigininin da
# kullandigi portlar. Ikisi AYNI ANDA calisamaz. Capacity Planner'i da
# ayaga kaldiracaksan once bu yigini durdur (ya da .env'den portlari degistir).

services:
  # Kabuk bizi kendi origin'inden servis ettigi icin arayuz /mailer/ onekiyle
  # derlenmeli ve API cagrilarini GORELI yapmali (bos VITE_API_BASE_URL) -
  # boylece istekler kabugun nginx'ine dusup oturum cerezi first-party kalir.
  mailer-frontend:
    build:
      args:
        VITE_BASE_PATH: /mailer/
        VITE_API_BASE_URL: ""
        VITE_ODYSSEY_URL: /

  odyssey-auth:
    build:
      context: ../Downloads/odyssey-auth
      dockerfile: Dockerfile
    container_name: aksa-mailer-odyssey-auth
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Kendi veritabani - aksa_mailer semasina dokunmaz.
      DB_NAME: odyssey_auth
      DB_USERNAME: ${DB_USERNAME:-aksa_mailer}
      DB_PASSWORD: ${DB_PASSWORD:-aksa_mailer}
      # mailer-backend token'i AYNI sirla dogruluyor.
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET .env icinde tanimlanmali}
      APP_JWT_COOKIE_SECURE: "false"
      APP_JWT_SAME_SITE: Lax
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${ODYSSEY_SHELL_PORT:-4173},http://localhost:${FRONTEND_PORT:-5174}
    ports:
      - "${ODYSSEY_AUTH_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  odyssey-shell:
    build:
      context: "../Downloads/Landing Page"
      dockerfile: Dockerfile
    container_name: aksa-mailer-odyssey-shell
    restart: unless-stopped
    volumes:
      # Imajdaki Railway sablonu yerine yerel surum: http + servis adlari.
      - ./local/odyssey-shell.nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${ODYSSEY_SHELL_PORT:-4173}:80"
    depends_on:
      - odyssey-auth
      - mailer-backend
      - mailer-frontend
