spring:
  application:
    name: aksa-mailer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aksa_mailer}
    username: ${DB_USERNAME:aksa_mailer}
    password: ${DB_PASSWORD:aksa_mailer}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # odyssey-auth ile AYNI olmak zorunda. Yayinda APP_JWT_SECRET ile ezilir.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  cors:
    # Odyssey kabugu API cagrilarini kendi nginx'i uzerinden proxy'ledigi icin
    # tarayici acisindan istek same-origin; ama backend proxy'nin ilettigi
    # Origin basligini (Odyssey alan adi) gorur, o yuzden listede olmali.
    allowed-origins:
      - http://localhost:4173
      - http://localhost:5173
      - http://localhost:5174

server:
  port: 8082

logging:
  level:
    com.aksa.mailer: DEBUG
