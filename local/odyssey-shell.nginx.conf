# Odyssey kabugunun YEREL nginx yapilandirmasi - Aksa Mailer yigini icin.
#
# Kabuk deposundaki "Landing Page/nginx.conf" Railway icin yazilmis:
# upstream'lere https ile ve public alan adlariyla gidiyor. Yerelde hepsi ayni
# Docker agindaki servisler oldugu icin http + servis adi kullaniyoruz.
# Bu dosya imajdaki sablonun UZERINE baglanir (bkz. docker-compose.odyssey.yml).
#
# DIKKAT: mount edilen bu dosya bir SABLON. nginx onu yalnizca konteyner
# BASLARKEN envsubst'ten gecirir - "nginx -s reload" sablonu yeniden islemez.
# Degistirdikten sonra: docker compose restart odyssey-shell

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Docker'in yerlesik DNS'i. Adresler degiskenle verildigi icin nginx
    # bunlari ACILISTA degil ISTEK ANINDA cozer; boylece bir servis gec
    # kalksa da nginx basarir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Oturum -> odyssey-auth (kendi veritabaniyla)
    location /api/auth/ {
        set $auth_ust "odyssey-auth:8081";
        proxy_pass http://$auth_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Aksa Mailer backend'i. nginx EN UZUN oneki secer - ileride bu kabuga
    # baska bir /api/ blogu eklenirse bu blok sirasi ne olursa olsun kazanir.
    location /api/mailer/ {
        set $mailer_api_ust "mailer-backend:8082";
        proxy_pass http://$mailer_api_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Aksa Mailer arayuzu -> /mailer/ altindan
    location = /mailer {
        return 301 /mailer/;
    }
    location /mailer/ {
        set $mailer_ust "mailer-frontend:80";
        rewrite ^/mailer/(.*)$ /$1 break;
        proxy_pass http://$mailer_ust;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^https?://[^/]+/(.*)$ /mailer/$1;
    }

    # Kabugun kendi statik sayfasi (katalog).
    #
    # Katalogdaki diger kartlar duruyor ama hepsi acilmaz: Railway'de yayinda
    # olanlar (Aksa Board, Izin Takvimi, RetroInsight) mutlak adres tasidigi
    # icin calisir; "PO Sprint Sunumu Hazirlayici" ise /kapasite/ yoluna
    # bakar ve o servis BU yiginda yok - 404 doner. Beklenen davranis:
    # Capacity Planner ayri bir proje, onu calistirmak istersen kendi
    # deposundan kaldirilir.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
